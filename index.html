<style>
  * { font-family: 'Heebo', sans-serif; }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    user-select: none;
    vertical-align: middle;
  }
  .material-symbols-outlined.filled {

  body { background: #f7f9fb; overscroll-behavior: none; }
  .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
  .bottom-safe { bottom: max(0px, env(safe-area-inset-bottom)); }

  /* ---------- Responsive: nothing wider than the screen, from 320px to desktop ---------- */
  /* clip (unlike hidden) doesn't create a scroll container, so the sticky header keeps working; hidden is the fallback for old browsers */
  html, body, #app { max-width: 100%; overflow-x: hidden; overflow-x: clip; }
  body { overflow-wrap: break-word; -webkit-text-size-adjust: 100%; }
  /* Screen height that accounts for the mobile browser's address bar (dvh), with a vh fallback for older browsers */
  .app-min-h { min-height: 100vh; min-height: 100dvh; }
  /* Flex items can shrink below their content width, so long text doesn't push buttons off the screen */
  .flex-1, .truncate { min-width: 0; }
  input, select, textarea, button { max-width: 100%; }
  input, select, textarea { min-width: 0; }
  /* Content area: room for the bottom nav bar + the safe area on iPhone */
  .main-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
  /* Bottom sheets: limited to the screen height, scroll internally, padding above the iPhone home bar.
     svh and not dvh: dvh changes when the keyboard opens and causes jumps while typing */
  .sheet-scroll { max-height: 85vh; max-height: 85svh; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .sheet-scroll-sm { max-height: 60vh; max-height: 60svh; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
  .sheet-body { padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
  /* Horizontal filter rows: scroll within themselves without widening the page */
  .chip-row { width: 100%; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chip-row::-webkit-scrollbar { display: none; }

  /* Modal animations */
  .modal-backdrop { transition: opacity 0.25s ease; }
  .bottom-sheet { transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
  .bottom-sheet.closed { transform: translateY(100%); }
  .bottom-sheet.open { transform: translateY(0); }
  .center-modal { transition: opacity 0.2s ease, transform 0.2s ease; }
  /* A closed dialog is fully hidden and doesn't receive taps (otherwise it's a transparent layer blocking the middle of the screen) */
  .center-modal.closed { opacity: 0; transform: scale(0.95); visibility: hidden; pointer-events: none !important;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s; }
  .center-modal.open { opacity: 1; transform: scale(1); visibility: visible; }
  /* Same for bottom sheets: after the close animation they're hidden and don't receive taps */
  .bottom-sheet.closed { visibility: hidden; pointer-events: none !important;
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), visibility 0s linear 0.3s; }
  .bottom-sheet.open { visibility: visible; }

  /* ---------- Touch ---------- */
  /* Removes the double-tap-zoom delay and the gray flash on tap */
  button, a, label, input, select, textarea, [onclick] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  input, textarea, select { user-select: text; -webkit-user-select: text; }
  /* iOS zooms in on focus when an input's text is smaller than 16px */
  @media (max-width: 767px) { input, select, textarea { font-size: 16px !important; } }

  /* Toast */
  .toast { transition: opacity 0.3s ease, transform 0.3s ease; }
  .toast.hidden { opacity: 0; transform: translateY(2rem); pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* Chip active */
  .filter-chip.active {
    background: #005c55;
    color: white;
    border-color: #005c55;

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #c2c7ce; border-radius: 9999px; }

  /* Autocomplete */
  #autocomplete-dropdown { z-index: 100; }

  /* Status buttons */
  .status-btn { transition: all 0.15s ease; }
  .status-btn.active-full { background: #DCFCE7; color: #15803D; border-color: #15803D; }
  .status-btn.active-half { background: #FEF3C7; color: #B45309; border-color: #B45309; }

  input[type=number]::-webkit-inner-spin-button,

<script>
// ============================================================
// SUPABASE
// ============================================================
// The publishable key is public by design: Row Level Security in the database protects the data
const SUPABASE_URL = 'https://npdpkyglgskyzfsrgerw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xjNsPfeHtuCMik1c-GAKGg_ndrYIi1n';
// The session is stored in localStorage and refreshed automatically, so the user stays logged in across refreshes
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});

const state = {
  currentTab: 'inventory',
  openModals: [],
  inventoryList: [],
  shoppingList: [],
  currentUser: { id: null, name: '', email: '', isLoggedIn: false },
  household: null,          // { id, name, invite_code }
  memberId: null,           // household_members.id של המשתמש המחובר
  familyMembers: [],
  categories: [],           // [{ id, name, icon }]
  settings: { notifications_enabled: true, dark_mode: false },
  authTab: 'login',
  authForm: { name: '', email: '', password: '' }, // keeps what was typed when switching between "כניסה" and "הרשמה"
  authMessage: null,        // { type: 'error' | 'success', text } — shown inside the auth form
  authBusy: false,
  inventoryFilter: { search: '', status: 'הכל', category: 'הכל' },
  editingItemId: null,
  deletingItemId: null,
  quickAddMode: 'new', // 'new' | 'existing'
  quickAddSelectedItem: null,
};

// ============================================================
// DATA LAYER (Supabase)
// ============================================================
function categoryIdByName(name) {
  const c = state.categories.find(c => c.name === name) || state.categories.find(c => c.name === 'כללי');
  return c ? c.id : null;
}
function categoryNameById(id) {
  const c = state.categories.find(c => c.id === id);
  return c ? c.name : 'כללי';
}
function memberName(id) {
  const m = state.familyMembers.find(m => m.id === id);
  return m ? m.name : '';
}

function rowToInventory(r) {
  return { id: r.id, name: r.name, quantity: r.quantity, status: r.status, category: categoryNameById(r.category_id), notes: r.notes || '', lastUpdated: r.last_updated };
}
function inventoryToRow(i) {
  return { id: i.id, household_id: state.household.id, category_id: categoryIdByName(i.category), name: i.name, quantity: i.quantity, status: i.status, notes: i.notes || null, updated_by: state.memberId };
}
function rowToShopping(r) {
  return { id: r.id, inventoryItemId: r.inventory_item_id, name: r.name, requestedQuantity: r.requested_quantity, note: r.note || '', addedById: r.added_by, addedBy: memberName(r.added_by), addedAt: r.added_at, isCompleted: r.is_completed };
}
function shoppingToRow(s) {
  return { id: s.id, household_id: state.household.id, inventory_item_id: s.inventoryItemId, name: s.name, requested_quantity: s.requestedQuantity, note: s.note || null, added_by: s.addedById || state.memberId, is_completed: s.isCompleted, completed_by: s.isCompleted ? state.memberId : null, completed_at: s.isCompleted ? new Date().toISOString() : null };
}

// Runs a Supabase request and shows an error on failure (the UI updates optimistically)
async function dbRun(promise, errMsg = 'שגיאה בשמירה לשרת') {
  const { data, error } = await promise;
  if (error) {
    console.error(error);
    showToast(errMsg, 'error');
    await loadHouseholdData();
    return null;
  }
  return data;
}

function dbSaveInventory(item, isNew = false) {
  const row = inventoryToRow(item);
  if (isNew) row.created_by = state.memberId;
  return dbRun(sb.from('inventory_items').upsert(row));
}
function dbDeleteInventory(id) {
  return dbRun(sb.from('inventory_items').delete().eq('id', id));
}
function dbSaveShopping(item) {
  return dbRun(sb.from('shopping_list_items').upsert(shoppingToRow(item)));
}
function dbDeleteShopping(ids) {
  return dbRun(sb.from('shopping_list_items').delete().in('id', [].concat(ids)));
}
function dbLogHistory(itemId, action, before, after, sourceShoppingId = null) {
  return dbRun(sb.from('inventory_history').insert({
    inventory_item_id: itemId, member_id: state.memberId, action,
    quantity_before: before ? before.quantity : null, quantity_after: after ? after.quantity : null,
    status_before: before ? before.status : null, status_after: after ? after.status : null,
    source_shopping_item_id: sourceShoppingId,
  }));
}

async function loadSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    state.currentUser = { id: null, name: '', email: '', isLoggedIn: false };
    state.household = null;
    state.inventoryList = []; state.shoppingList = []; state.familyMembers = [];
    return;
  }
  const u = session.user;
  state.currentUser = { id: u.id, name: u.user_metadata?.display_name || u.email, email: u.email, isLoggedIn: true };

  const { data: settings } = await sb.from('user_settings').select('*').eq('user_id', u.id).maybeSingle();
  if (settings) state.settings = settings;

  const { data: memberships } = await sb.from('household_members')
    .select('id, household_id, households(id, name, invite_code)').eq('user_id', u.id);
  const mine = (memberships || []).find(m => m.household_id === settings?.active_household_id) || (memberships || [])[0];
  state.household = mine ? mine.households : null;
  state.memberId = mine ? mine.id : null;

  await loadHouseholdData();
}

async function loadHouseholdData() {
  if (!state.household) return;
  const hid = state.household.id;
  const [cats, members, inv, shop] = await Promise.all([
    sb.from('categories').select('*').order('sort_order'),
    sb.from('household_members').select('*').eq('household_id', hid).order('created_at'),
    sb.from('inventory_items').select('*').eq('household_id', hid).order('last_updated', { ascending: false }),
    sb.from('shopping_list_items').select('*').eq('household_id', hid).order('added_at', { ascending: false }),
  ]);
  const err = cats.error || members.error || inv.error || shop.error;
  if (err) { console.error(err); showToast('שגיאה בטעינת הנתונים', 'error'); return; }
  state.categories = cats.data;
  state.familyMembers = members.data.map(m => ({ id: m.id, name: m.name, role: m.role, avatar: m.avatar || m.name.charAt(0), isAdmin: m.is_admin }));
  state.inventoryList = inv.data.map(rowToInventory);
  state.shoppingList = shop.data.map(rowToShopping);
  refreshUI();
}

let realtimeChannel = null;
let reloadTimer = null;
function subscribeRealtime() {
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  if (!state.household) return;
  const hid = state.household.id;
  const onChange = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadHouseholdData, 400); };
  realtimeChannel = sb.channel('household-' + hid);
  ['inventory_items', 'shopping_list_items', 'household_members'].forEach(table => {
    realtimeChannel.on('postgres_changes', { event: '*', schema: 'public', table, filter: 'household_id=eq.' + hid }, onChange);
  });
  realtimeChannel.subscribe();
}

function refreshUI() {
  if (!document.getElementById('main-content')) return;
  renderActiveTab();
  updateHeader();
  const typingInProfile = document.getElementById('modal-profile')?.contains(document.activeElement)
    && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (state.openModals.includes('profile') && !typingInProfile) renderProfileModal();
  enforceAccessGate();
}

// The logged-in user's name: their name in the family, then the name from sign-up, then the part of the email before the @
function currentUserDisplayName() {
  const u = state.currentUser;
  if (!u.isLoggedIn) return '';
  const member = state.familyMembers.find(m => m.id === state.memberId);
  if (member?.name) return member.name;
  if (u.name && !u.name.includes('@')) return u.name;
  return (u.email || '').split('@')[0];
}

function updateHeader() {
  const sub = document.getElementById('header-subtitle');
  if (sub) sub.textContent = currentUserDisplayName() || 'לא מחובר/ת';
  const initials = document.getElementById('user-avatar-initials');
  if (initials) initials.textContent = (currentUserDisplayName() || 'א').charAt(0);
  const lowCount = state.inventoryList.filter(i => i.status === 'כמעט ריק').length;
  document.getElementById('notif-badge').classList.toggle('hidden', lowCount === 0);
}

// ============================================================
// UTILS
// ============================================================
function genId() { return crypto.randomUUID(); }

function statusConfig(s) {
  if (s === 'מלא') return { bg: 'bg-status-full-bg', text: 'text-status-full-text', label: 'מלא' };
  if (s === 'חצי') return { bg: 'bg-status-half-bg', text: 'text-status-half-text', label: 'חצי' };
  return { bg: 'bg-status-empty-bg', text: 'text-status-empty-text', label: 'כמעט ריק' };
}

// A single status-by-quantity calculation (replaces the two different ones in the old code)
function statusFromQuantity(q) {
  return q >= 3 ? 'מלא' : q >= 1 ? 'חצי' : 'כמעט ריק';
}

function cycleStatus(current) {
  const order = ['מלא', 'חצי', 'כמעט ריק'];
  return order[(order.indexOf(current) + 1) % 3];
}

function categoryNames() {
  return state.categories.length ? state.categories.map(c => c.name) : ['מקרר', 'מזווה', 'חומרי ניקוי', 'קפאון', 'כללי'];
}

function categoryIcon(cat) {
  const dbCat = state.categories.find(c => c.name === cat);
  if (dbCat && dbCat.icon) return dbCat.icon;
  const map = { 'מקרר': 'kitchen', 'מזווה': 'shelves', 'חומרי ניקוי': 'cleaning_services', 'קפאון': 'ac_unit', 'כללי': 'category' };
  return map[cat] || 'category';
}

let toastTimer = null;
function showToast(msg, icon = 'check_circle') {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-icon').textContent = icon;
  t.classList.remove('hidden');
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
    t.classList.add('hidden');
  }, 2800);
}

// ============================================================
// NAVIGATION
// ============================================================
function switchTab(tab) {
  state.currentTab = tab;
  renderActiveTab(true);
  updateNavBar();
}

function updateNavBar() {
  const tabs = ['inventory', 'shopping'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab-' + t);
    const icon = document.getElementById('icon-' + t);
    const label = document.getElementById('label-' + t);
    if (t === state.currentTab) {
      btn.classList.add('text-primary');
      btn.classList.remove('text-on-surface-variant');
      icon.classList.add('filled', 'text-primary');
      icon.classList.remove('text-on-surface-variant');
      label.classList.add('font-bold', 'text-primary');
    } else {
      btn.classList.remove('text-primary');
      btn.classList.add('text-on-surface-variant');
      icon.classList.remove('filled', 'text-primary');
      icon.classList.add('text-on-surface-variant');
      label.classList.remove('font-bold', 'text-primary');
    }
  });
}

// force=false: if the current screen is already shown, only #screen-body is updated (the list),
// and the fields at the top of the screen aren't rebuilt, so the keyboard doesn't close while typing
function renderActiveTab(force = false) {
  const main = document.getElementById('main-content');
  const body = document.getElementById('screen-body');
  if (!force && hasAccess() && body && main.dataset.tab === state.currentTab) {
    body.innerHTML = state.currentTab === 'inventory' ? renderInventoryBody() : renderShoppingBody();
    return;
  }
  main.dataset.tab = hasAccess() ? state.currentTab : '';
  if (!hasAccess()) {
    main.innerHTML = renderLockedScreen();
  } else if (state.currentTab === 'inventory') {
    main.innerHTML = renderInventoryScreen();
    attachInventoryListeners();
  } else {
    main.innerHTML = renderShoppingScreen();
    attachShoppingListeners();
  }
}

// ============================================================
// MODAL SYSTEM
// ============================================================
// ============================================================
// ACCESS GATE: without a logged-in user who belongs to a household, only the login window is shown
// ============================================================
function hasAccess() {
  return state.currentUser.isLoggedIn && !!state.household;
}

function enforceAccessGate() {
  const locked = !hasAccess();
  document.getElementById('bottom-nav')?.classList.toggle('hidden', locked);
  document.getElementById('notif-button')?.classList.toggle('invisible', locked);
  document.getElementById('profile-close-btn')?.classList.toggle('hidden', locked);
  if (!locked) return;
  state.openModals.filter(m => m !== 'profile').forEach(closeModal);
  if (!state.openModals.includes('profile')) openModal('profile');
}

function renderLockedScreen() {
  return `
    <div class="flex flex-col items-center justify-center text-center px-8 py-24">
      <span class="material-symbols-outlined text-outline-variant" style="font-size:64px">lock</span>
      <p class="text-title-md font-bold text-on-surface mt-4">יש להתחבר כדי להשתמש במערכת</p>
    </div>`;
}

function openModal(name) {
  if (name !== 'profile' && !hasAccess()) name = 'profile';
  if (state.openModals.includes(name)) return;
  state.openModals.push(name);
  renderModal(name);

  const backdrop = document.getElementById('modal-backdrop');
  backdrop.classList.remove('pointer-events-none', 'opacity-0');
  backdrop.classList.add('opacity-100');

  const sheet = getModalSheet(name);
  if (sheet) {
    requestAnimationFrame(() => {
      sheet.classList.remove('closed');
      sheet.classList.add('open');
    });
  }
}

function closeModal(name) {
  if (name === 'profile' && !hasAccess()) return; // the login window can't be closed without logging in
  const idx = state.openModals.indexOf(name);
  if (idx === -1) return;
  state.openModals.splice(idx, 1);

  const sheet = getModalSheet(name);
  if (sheet) {
    sheet.classList.add('closed');
    sheet.classList.remove('open');
  }

  if (state.openModals.length === 0) {
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.add('pointer-events-none', 'opacity-0');
    backdrop.classList.remove('opacity-100');
  }
}

function closeTopModal() {
  if (state.openModals.length > 0) {
    closeModal(state.openModals[state.openModals.length - 1]);
  }
}

function getModalSheet(name) {
  const map = {
    quickAdd: document.getElementById('modal-quickAdd'),
    edit: document.getElementById('modal-edit-sheet'),
    profile: document.getElementById('modal-profile-sheet'),
    notifications: document.getElementById('modal-notifications-sheet'),
  };
  return map[name];
}

function renderModal(name) {
  if (name === 'quickAdd') renderQuickAddModal();
  if (name === 'edit') renderEditModal();
  if (name === 'profile') renderProfileModal();
}

function filteredInventory() {
  const { search, status: statusFilter, category: catFilter } = state.inventoryFilter;
  return state.inventoryList.filter(item => {
    const matchSearch = !search || item.name.includes(search);
    const matchStatus = statusFilter === 'הכל' || item.status === statusFilter;
    const matchCat = catFilter === 'הכל' || item.category === catFilter;
    return matchSearch && matchStatus && matchCat;
  });
}

// Fixed part of the screen (search + filters). Not rebuilt while typing, so the field keeps focus
function renderInventoryScreen() {
  const { search } = state.inventoryFilter;

    <!-- Status Filter Chips -->
    <div class="px-4 pb-2">

          <button onclick="setInventoryFilter('status','${chip}')"

            ${chip}

            <span class="material-symbols-outlined text-xs align-middle" style="font-size:14px">${chip === 'הכל' ? 'apps' : categoryIcon(chip)}</span>

// The part that updates: count + list of items

    <div class="inventory-card bg-surface-container-lowest rounded-2xl p-4 shadow-sm border border-outline-variant cursor-pointer"

function renderInventoryEmpty() {
  return `
    <div class="text-center py-16 text-on-surface-variant">
      <span class="material-symbols-outlined text-6xl mb-4 block opacity-30">inventory_2</span>
      <p class="text-title-md font-medium mb-1">לא נמצאו פריטים</p>
      <p class="text-body-md opacity-70">נסה לשנות את הפילטר או הוסף פריט חדש</p>
    </div>
  `;
}

function attachInventoryListeners() {
  // already using inline onclick
}

function onInventorySearch(val) {
  state.inventoryFilter.search = val;
  reRenderInventoryList();
}

function setInventoryFilter(key, val) {
  state.inventoryFilter[key] = val;
  if (state.currentTab === 'inventory') renderActiveTab(true);
}

function reRenderInventoryList() {
  if (state.currentTab === 'inventory') renderActiveTab();
}

function cycleItemStatus(id) {
  const item = state.inventoryList.find(i => i.id === id);
  if (!item) return;
  const before = { ...item };
  item.status = cycleStatus(item.status);
  item.lastUpdated = new Date().toISOString();
  renderActiveTab();
  showToast(`${item.name}: ${item.status}`, 'sync');
  dbSaveInventory(item).then(() => dbLogHistory(item.id, 'status_changed', before, item));
}

function quickAddToCart(itemId) {
  const item = state.inventoryList.find(i => i.id === itemId);
  if (!item) return;
  const existing = state.shoppingList.find(s => !s.isCompleted && (s.inventoryItemId === itemId || s.name === item.name));
  if (existing) {
    // Remove from cart
    state.shoppingList = state.shoppingList.filter(s => s.id !== existing.id);
    renderActiveTab();
    showToast(`${item.name} הוסר מהרשימה`, 'remove_shopping_cart');
    dbDeleteShopping(existing.id);
  } else {
    const newItem = {
      id: genId(),
      inventoryItemId: itemId,
      name: item.name,
      requestedQuantity: 1,
      note: '',
      addedById: state.memberId,
      addedBy: memberName(state.memberId),
      addedAt: new Date().toISOString(),
      isCompleted: false,
    };
    state.shoppingList.unshift(newItem);
    dbSaveShopping(newItem);
    renderActiveTab();
    showToast(`${item.name} נוסף לרשימה!`, 'shopping_cart');
  }
}

function openEditFromCard(id) {
  state.editingItemId = id;
  openModal('edit');
}

      <div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm border border-outline-variant">
        <h3 class="text-title-sm font-bold text-on-surface mb-3">הוסף לרשימה מהירה</h3>
        <div class="flex gap-2">

function renderShoppingBody() {

function renderShoppingItem(item) {
  const invItem = item.inventoryItemId ? state.inventoryList.find(i => i.id === item.inventoryItemId) : null;

        <div class="flex items-center gap-2">
          <span class="text-body-lg font-medium text-on-surface ${item.isCompleted ? 'line-through' : ''} truncate">${escapeHtml(item.name)}</span>

          <span class="text-label-sm text-on-surface-variant opacity-70">הוסיף: ${escapeHtml(item.addedBy)}</span>
          ${invItem ? `<span class="text-label-sm text-primary/70">↔ מלאי</span>` : ''}
        </div>
      </div>
      <button onclick="removeShoppingItem('${item.id}')"
        class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-error hover:bg-status-empty-bg active:scale-90 transition-all flex-shrink-0">
        <span class="material-symbols-outlined" style="font-size:18px">delete</span>
      </button>
    </div>
  `;
}

function attachShoppingListeners() {}

function shopQuickAdd() {
  const nameEl = document.getElementById('shop-quick-name');
  const qtyEl = document.getElementById('shop-quick-qty');
  const name = nameEl.value.trim();
  const qty = parseInt(qtyEl.value) || 1;
  if (!name) { nameEl.focus(); return; }

  // Check if exists in inventory
  const invMatch = state.inventoryList.find(i => i.name === name);

  const newItem = {
    id: genId(),
    inventoryItemId: invMatch ? invMatch.id : null,
    name,
    requestedQuantity: qty,
    note: '',
    addedById: state.memberId,
    addedBy: memberName(state.memberId),
    addedAt: new Date().toISOString(),
    isCompleted: false,
  };
  state.shoppingList.unshift(newItem);
  dbSaveShopping(newItem);
  nameEl.value = '';
  qtyEl.value = '1';
  renderActiveTab();
  showToast(`${name} נוסף לרשימה!`, 'shopping_cart');
}

async function toggleShoppingItem(id, checked) {
  const item = state.shoppingList.find(s => s.id === id);
  if (!item) return;
  item.isCompleted = checked;

  if (!checked) {
    dbSaveShopping(item);
    setTimeout(() => renderActiveTab(), 300);
    return;
  }

  // Find the matching inventory item: by link, otherwise by name
  const normName = s => (s || '').trim().toLowerCase();
  let invItem = state.inventoryList.find(i => i.id === item.inventoryItemId)
    || state.inventoryList.find(i => normName(i.name) === normName(item.name));

  if (invItem) {
    const before = { ...invItem };
    invItem.quantity += item.requestedQuantity;
    invItem.status = statusFromQuantity(invItem.quantity);
    invItem.lastUpdated = new Date().toISOString();
    item.inventoryItemId = invItem.id;
    dbSaveShopping(item);
    dbSaveInventory(invItem).then(() => dbLogHistory(invItem.id, 'restocked', before, invItem, item.id));
    showToast(`${invItem.name} עודכן במלאי!`, 'sync');
  } else {
    // The product isn't in inventory yet: create it in the "כללי" category (can be changed later from the edit screen)
    invItem = {
      id: genId(),
      name: item.name.trim(),
      quantity: item.requestedQuantity,
      status: statusFromQuantity(item.requestedQuantity),
      category: 'כללי',
      notes: '',
      lastUpdated: new Date().toISOString(),
    };
    state.inventoryList.unshift(invItem);
    item.inventoryItemId = invItem.id;
    // The inventory item has to exist in the database before the shopping item links to it
    await dbSaveInventory(invItem, true);
    dbSaveShopping(item);
    dbLogHistory(invItem.id, 'created', null, invItem, item.id);
    showToast(`${invItem.name} נוסף למלאי!`, 'add_circle');
  }

  setTimeout(() => renderActiveTab(), 300);
}

function removeShoppingItem(id) {
  const item = state.shoppingList.find(s => s.id === id);
  state.shoppingList = state.shoppingList.filter(s => s.id !== id);
  dbDeleteShopping(id);
  renderActiveTab();
  if (item) showToast(`${item.name} הוסר`, 'delete');
}

// "סמן הכל": marks every item on the list as purchased (and updates the inventory, like a checkbox)
async function markAllPurchased() {
  const ids = state.shoppingList.filter(s => !s.isCompleted).map(s => s.id);
  for (const id of ids) await toggleShoppingItem(id, true);
  if (ids.length) showToast(`${ids.length} פריטים סומנו כנרכשו ועודכנו במלאי`, "done_all");
}

function clearCompleted() {
  const doneIds = state.shoppingList.filter(s => s.isCompleted).map(s => s.id);
  if (doneIds.length) dbDeleteShopping(doneIds);
  state.shoppingList = state.shoppingList.filter(s => !s.isCompleted);
  renderActiveTab();
  showToast('פריטים שנרכשו נמחקו', 'done_all');
}

function onQANameInput(val) {
  const matches = state.inventoryList.filter(i => val.length >= 1 && i.name.includes(val));
  const dd = document.getElementById('autocomplete-dropdown');
  if (!dd) return;
  if (matches.length === 0) {
    dd.classList.add('hidden');
    // If was existing mode, reset
    if (state.quickAddMode === 'existing') {
      state.quickAddMode = 'new';
      state.quickAddSelectedItem = null;
      updateQuickAddDetails();
    }
    return;
  }
  dd.classList.remove('hidden');
  dd.innerHTML = matches.map(item => {
    const sc = statusConfig(item.status);
    return `
      <button type="button" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-surface-container text-right transition-colors"
        onpointerdown="event.preventDefault()" onmousedown="event.preventDefault()" onclick="selectAutocompleteItem('${item.id}')">

function selectAutocompleteItem(id) {

  qaSelectedStatus = status;
  ['מלא','חצי','כמעט ריק'].forEach(s => {

    const btn = document.getElementById(id);

    btn.classList.remove('active-full','active-half','active-empty','bg-surface-container-lowest');

function qaStepQty(delta) {
  const el = document.getElementById('qa-qty');
  if (!el) return;
  el.value = Math.max(1, (parseInt(el.value) || 1) + delta);
}

function submitQuickAdd() {
  const nameEl = document.getElementById('qa-name');
  const qtyEl = document.getElementById('qa-qty');
  if (!nameEl || !qtyEl) return;
  const name = nameEl.value.trim();
  const qty = parseInt(qtyEl.value) || 1;
  if (!name) { nameEl.focus(); return; }

  if (state.quickAddMode === 'existing' && state.quickAddSelectedItem) {
    const item = state.inventoryList.find(i => i.id === state.quickAddSelectedItem.id);
    if (item) {
      const before = { ...item };
      item.quantity += qty;
      item.status = statusFromQuantity(item.quantity);
      item.lastUpdated = new Date().toISOString();
      dbSaveInventory(item).then(() => dbLogHistory(item.id, 'restocked', before, item));
      showToast(`${item.name} עודכן! כמות: ${item.quantity}`, 'inventory');
    }
  } else {
    const existing = state.inventoryList.find(i => i.name === name);
    if (existing) {
      const before = { ...existing };
      existing.quantity += qty;
      existing.lastUpdated = new Date().toISOString();
      dbSaveInventory(existing).then(() => dbLogHistory(existing.id, 'restocked', before, existing));
      showToast(`${name} עודכן במלאי!`, 'inventory');
    } else {
      const newItem = {
        id: genId(),
        name,
        quantity: qty,
        status: qaSelectedStatus,
        category: qaSelectedCategory,
        notes: '',
        lastUpdated: new Date().toISOString(),
      };
      state.inventoryList.unshift(newItem);
      dbSaveInventory(newItem, true).then(() => dbLogHistory(newItem.id, 'created', null, newItem));
      showToast(`${name} נוסף למלאי!`, 'add_circle');
    }
  }

  state.quickAddMode = 'new';
  state.quickAddSelectedItem = null;
  closeModal('quickAdd');
  if (state.currentTab === 'inventory') renderActiveTab();
}

function saveEditItem(id) {
  const item = state.inventoryList.find(i => i.id === id);
  if (!item) return;
  const nameEl = document.getElementById('edit-name');
  const qtyEl = document.getElementById('edit-qty');
  const notesEl = document.getElementById('edit-notes');
  if (!nameEl || !qtyEl) return;

  const newName = nameEl.value.trim();
  if (!newName) { nameEl.focus(); return; }

  const before = { ...item };
  item.name = newName;
  item.quantity = parseInt(qtyEl.value) || 0;
  item.category = window._editCategory || item.category;
  item.status = window._editStatus || item.status;
  item.notes = notesEl ? notesEl.value.trim() : '';

  dbSaveInventory(item).then(() => dbLogHistory(item.id, before.status !== item.status ? 'status_changed' : 'updated', before, item));

  closeModal('edit');
  if (state.currentTab === 'inventory') renderActiveTab();
  showToast(`${item.name} עודכן!`, 'save');

  const id = state.deletingItemId;
  if (!id) return;
  const item = state.inventoryList.find(i => i.id === id);
  state.inventoryList = state.inventoryList.filter(i => i.id !== id);
  // Remove linked shopping items
  state.shoppingList = state.shoppingList.map(s => s.inventoryItemId === id ? { ...s, inventoryItemId: null } : s);
  dbDeleteInventory(id); // ON DELETE SET NULL takes care of the shopping list on the server
  cancelDelete();
  closeModal('edit');
  if (state.currentTab === 'inventory') renderActiveTab();
  if (item) showToast(`${item.name} נמחק`, 'delete');
}

// Translates Supabase auth errors into Hebrew messages
function authErrorToHebrew(error) {
  const msg = (error?.message || '').toLowerCase();
  if (msg.includes('invalid login credentials')) return 'אימייל או סיסמה שגויים, או שהחשבון עדיין ממתין לאישור במייל.';
  if (msg.includes('email not confirmed')) return 'יש לאשר את כתובת האימייל דרך הקישור שנשלח אליך לפני הכניסה.';
  if (msg.includes('already registered') || msg.includes('already been registered')) return 'משתמש עם כתובת אימייל זו כבר רשום במערכת.';
  if (msg.includes('password should be at least')) return 'הסיסמה חייבת להכיל לפחות 6 תווים.';
  if (msg.includes('invalid') && msg.includes('email')) return 'כתובת האימייל אינה תקינה.';
  if (msg.includes('rate limit') || error?.status === 429) return 'בוצעו יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.';
  if (msg.includes('failed to fetch') || msg.includes('network')) return 'אין חיבור לשרת. בדקו את החיבור לאינטרנט ונסו שוב.';
  return 'אירעה שגיאה: ' + (error?.message || 'שגיאה לא ידועה');
}

async function submitAuth() {
  if (state.authBusy) return;
  const isSignup = state.authTab === 'signup';
  const f = state.authForm;
  const email = f.email.trim().toLowerCase();
  const password = f.password.trim();
  const name = f.name.trim();
  f.email = email;

  if (!email || !password) { setAuthMessage('error', 'נא למלא אימייל וסיסמה.'); return; }
  if (isSignup && password.length < 6) { setAuthMessage('error', 'הסיסמה חייבת להכיל לפחות 6 תווים.'); return; }

  state.authBusy = true;
  setAuthMessage(null);

  let result;
  try {
    result = isSignup
      ? await sb.auth.signUp({ email, password, options: { data: { display_name: name || null } } })
      : await sb.auth.signInWithPassword({ email, password });
  } catch (e) {
    result = { data: {}, error: e };
  }
  state.authBusy = false;

  if (result.error) {
    console.error(`[auth] ${isSignup ? 'signUp' : 'signInWithPassword'} failed:`, result.error);
    setAuthMessage('error', authErrorToHebrew(result.error));
    return;
  }

  const { user, session } = result.data;

  if (isSignup && !session) {
    // With email confirmation on, Supabase returns a user with no identities when the email is already registered
    if (user && Array.isArray(user.identities) && user.identities.length === 0) {
      setAuthMessage('error', 'משתמש עם כתובת אימייל זו כבר רשום במערכת.');
      return;
    }
    // Email confirmation required: switch to the login tab with the email already filled in
    state.authTab = 'login';
    f.password = '';
    setAuthMessage('success', 'החשבון נוצר! יש להיכנס למייל ולאשר את ההרשמה לפני ההתחברות.');
    return;
  }

  // Logged in (or signed up without confirmation): load the data and update the screen right away
  state.authForm = { name: '', email: '', password: '' };
  state.authMessage = null;
  sb.from('users').update({ last_login_at: new Date().toISOString() }).eq('id', user.id).then(({ error }) => {
    if (error) console.error('[auth] last_login_at update failed:', error);
  });
  await afterLogin();
  showToast(isSignup ? 'נרשמת בהצלחה!' : 'התחברת בהצלחה!', 'check_circle');
}

async function createHousehold() {
  const name = document.getElementById('hh-name')?.value.trim();
  const memberNameVal = document.getElementById('hh-member-name')?.value.trim();
  const role = document.getElementById('hh-role')?.value;
  if (!name || !memberNameVal) { showToast('נא למלא את שם הבית ואת השם שלך', 'error'); return; }
  const { error } = await sb.rpc('create_household', { p_name: name, p_member_name: memberNameVal, p_role: role });
  if (error) { console.error(error); showToast('שגיאה ביצירת הבית', 'error'); return; }
  await afterLogin();
  showToast(`ברוכים הבאים ל${name}!`, 'family_home');
}

async function joinHousehold() {
  const code = document.getElementById('hh-code')?.value.trim();
  const memberNameVal = document.getElementById('hh-member-name')?.value.trim();
  const role = document.getElementById('hh-role')?.value;
  if (!code || !memberNameVal) { showToast('נא למלא קוד הזמנה ואת השם שלך', 'error'); return; }
  const { data, error } = await sb.rpc('join_household', { p_invite_code: code, p_member_name: memberNameVal, p_role: role });
  if (error) { console.error(error); showToast('קוד הזמנה לא תקין', 'error'); return; }
  await afterLogin();
  showToast(`הצטרפת ל${data.name}!`, 'family_home');
}

function inviteFamilyMember() {
  const code = state.household?.invite_code;
  if (!code) return;
  if (navigator.clipboard) navigator.clipboard.writeText(code).catch(() => {});
  showToast(`קוד ההזמנה ${code} הועתק. שלחו אותו לבן המשפחה`, 'content_copy');
}

async function saveSetting(key, value) {
  state.settings[key] = value;
  if (key === 'dark_mode') document.documentElement.classList.toggle('dark', value);
  await dbRun(sb.from('user_settings').update({ [key]: value }).eq('user_id', state.currentUser.id));
}

// If afterLogin is already running (e.g. submitAuth + the SIGNED_IN event together), return the same run
let afterLoginRun = null;
function afterLogin() {
  if (!afterLoginRun) afterLoginRun = doAfterLogin().finally(() => { afterLoginRun = null; });
  return afterLoginRun;
}

async function doAfterLogin() {
  await loadSession();
  subscribeRealtime();
  refreshUI();
  if (state.household) {
    closeModal('profile');
  } else if (state.openModals.includes('profile')) {
    renderProfileModal();
  } else {
    openModal('profile');
  }
}

async function logout() {
  await sb.auth.signOut();
  showToast('התנתקת בהצלחה', 'logout');
}

function showAuthTab(tab) {
  if (state.authTab === tab) return;
  state.authTab = tab;
  state.authMessage = null; // values typed into the fields are kept in state.authForm
  renderProfileModal();
}

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
// INIT
// ============================================================
async function init() {
  switchTab('inventory');
  updateNavBar();
  await loadSession();
  document.documentElement.classList.toggle('dark', !!state.settings.dark_mode);
  subscribeRealtime();
  refreshUI(); // includes enforceAccessGate, which opens the login window if needed

  // Keeps the screen in sync with the session: login from another tab, return from the confirmation link, logout.
  // Skips SIGNED_IN for a user who is already loaded (Supabase sends it again on token refresh / window focus)
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN') {
      setTimeout(() => {
        if (state.currentUser.isLoggedIn && state.currentUser.id === session?.user?.id) return;
        afterLogin();
      }, 0);
    }
    if (event === 'SIGNED_OUT') {
      setTimeout(async () => {
        await loadSession();
        subscribeRealtime();
        refreshUI();
        if (!state.openModals.includes('profile')) openModal('profile');
        else renderProfileModal();
      }, 0);
    }
  });
}

document.addEventListener('DOMContentLoaded', init);
